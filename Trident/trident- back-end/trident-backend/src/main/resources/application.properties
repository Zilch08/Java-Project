spring.application.name=trident
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trident_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:TridentDevelopmentSecretKeyChangeThisToAtLeastThirtyTwoBytes}
app.jwt.expiration-ms=86400000
